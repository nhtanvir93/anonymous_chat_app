services:
  - type: web
    name: anonymous-chat-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: POSTGRES_HOST
        fromDatabase:
          name: anonymous-chat-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: anonymous-chat-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: anonymous-chat-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: anonymous-chat-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: anonymous-chat-db
          property: database
      - key: REDIS_HOST
        fromService:
          name: anonymous-chat-redis
          type: pserv
          property: host
      - key: REDIS_PORT
        fromService:
          name: anonymous-chat-redis
          type: pserv
          property: port

  - type: pserv
    name: anonymous-chat-redis
    runtime: image
    image:
      url: docker.io/redis:7-alpine

databases:
  - name: anonymous-chat-db
    databaseName: anonymous_chat
    user: postgres